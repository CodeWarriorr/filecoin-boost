version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

networks:
  default:
    name: devnet

volumes:
  yugabytedb-data:
  demo-http-server-data:
  booster-bitswap-data:
  boost-data:
  boostd-data:
  lotus-data:
  lotus-miner-data:
  genesis-data:

services:
  lotus:
    container_name: lotus
    image: ${LOTUS_IMAGE}
    init: true
    ports:
      - "1234:1234"
      - "9090:9090"
    environment:
      - LOTUS_FEVM_ENABLEETHRPC=true
      - LOTUS_API_LISTENADDRESS=/dns/lotus/tcp/1234/http
      - LOTUS_LIBP2P_LISTENADDRESSES=/ip4/0.0.0.0/tcp/9090
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - lotus-data:/var/lib/lotus:rw
      - genesis-data:/var/lib/genesis:rw
      - ${FIL_PROOFS_PARAMETER_CACHE}:/var/tmp/filecoin-proof-parameters:rw
    healthcheck:
      test: "lotus chain head"
      interval: 10s
      timeout: 5s
      retries: 10

  lotus-miner:
    container_name: lotus-miner
    image: ${LOTUS_MINER_IMAGE}
    init: true
    depends_on:
      lotus:
        condition: service_healthy
    ports:
      - "2345:2345"
    environment:
      - LOTUS_API_LISTENADDRESS=/dns/lotus-miner/tcp/2345/http
      - LOTUS_API_REMOTELISTENADDRESS=lotus-miner:2345
      - LOTUS_SEALING_BATCHPRECOMMITS=false
      - LOTUS_SEALING_AGGREGATECOMMITS=false
      - LOTUS_SEALING_MINCOMMITBATCH=1
      - LOTUS_SEALING_MAXCOMMITBATCH=1
      - LOTUS_SEALING_COMMITBATCHWAIT=1s
      - LOTUS_SEALING_STARTEPOCHSEALINGBUFFER=20
      - LOTUS_SUBSYSTEMS_ENABLEMARKETS=false
      - LOTUS_SEALING_WAITDEALSDELAY=20s
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - lotus-miner-data:/var/lib/lotus-miner:rw
      - lotus-data:/var/lib/lotus:ro
      - genesis-data:/var/lib/genesis:ro
      - ${FIL_PROOFS_PARAMETER_CACHE}:/var/tmp/filecoin-proof-parameters:rw
    healthcheck:
      test: "lotus-miner info"
      interval: 10s
      timeout: 5s
      retries: 10

  boost:
    container_name: boost
    image: ${BOOST_IMAGE}
    init: true
    depends_on:
      lotus-miner:
        condition: service_healthy
      yugabytedb:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "1288:1288" # For the /metrics endpoint
      - "50000:50000" # Exposed libp2p port
      - "3104:3104" # Exposed http port for IPNI
    environment:
      - LOTUS_API_LISTENADDRESS=/dns/boost/tcp/1288/http
      - LOTUS_PATH=/var/lib/lotus
      - LOTUS_MINER_PATH=/var/lib/lotus-miner
      - LOTUS_TRACING_ENABLED=true
      - LOTUS_TRACING_SERVICENAME=boostd
      - LOTUS_TRACING_ENDPOINT=http://tempo:14268/api/traces
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - boostd-data:/var/lib/boostd-data:rw
      - boost-data:/var/lib/boost:rw
      - lotus-data:/var/lib/lotus:ro
      - lotus-miner-data:/var/lib/lotus-miner:ro
      - demo-http-server-data:/app/public:rw
    healthcheck:
      test: "curl -f --head http://$(hostname -i):1288/metrics"
      interval: 10s
      timeout: 5s
      retries: 10

  booster-http:
    container_name: booster-http
    image: ${BOOSTER_HTTP_IMAGE}
    init: true
    depends_on:
      boost:
        condition: service_healthy
    ports:
      - "7777:7777"
    environment:
      - BOOST_PATH=/var/lib/boost
      - LID_API_INFO=http://boost:8044
      - LOTUS_PATH=/var/lib/lotus
      - LOTUS_MINER_PATH=/var/lib/lotus-miner
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - boost-data:/var/lib/boost:ro
      - lotus-data:/var/lib/lotus:ro
      - lotus-miner-data:/var/lib/lotus-miner:ro
    healthcheck:
      test: "curl -f --head http://localhost:7777"
      interval: 10s
      timeout: 5s
      retries: 10

  booster-bitswap:
    container_name: booster-bitswap
    image: ${BOOSTER_BITSWAP_IMAGE}
    init: true
    depends_on:
      boost:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      - BOOSTER_BITSWAP_REPO=/var/lib/booster-bitswap
      - BOOST_PATH=/var/lib/boost
      - LID_API_INFO=http://boost:8044
      - LOTUS_PATH=/var/lib/lotus
      - LOTUS_MINER_PATH=/var/lib/lotus-miner
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - booster-bitswap-data:/var/lib/booster-bitswap:rw
      - boost-data:/var/lib/boost:ro
      - lotus-data:/var/lib/lotus:ro
      - lotus-miner-data:/var/lib/lotus-miner:ro
    healthcheck:
      test: "curl -f --head localhost:9696/metrics"
      interval: 10s
      timeout: 5s
      retries: 10

  demo-http-server:
    container_name: demo-http-server
    image: nginx:1.23-alpine
    init: true
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - demo-http-server-data:/usr/share/nginx/html:ro
    healthcheck:
      test: "curl -f --head http://localhost"
      interval: 10s
      timeout: 5s
      retries: 10

  yugabytedb:
    container_name: yugabytedb
    image: yugabytedb/yugabyte:2024.1.0.0-b129
    init: true
    ports:
      - "5433:5433"
      - "9000:9000"
      - "9042:9042"
      - "15433:15433"
    environment:
      - TINI_SUBREAPER=true
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - yugabytedb-data:/home/yugabyte/yb_data
    command: "bin/yugabyted start --base_dir=/home/yugabyte/yb_data --background=false"
    healthcheck:
      test: "ysqlsh -h $(hostname -i) -p 5433 -U yugabyte || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
